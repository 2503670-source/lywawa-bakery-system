<!DOCTYPE html>
<html>
<head>
<title>Dashboard - Lywawa Bakery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:0;background-image:url('bakery1.jpg');background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat}
.top{background:rgba(191,54,12,0.95);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.top a{color:white;text-decoration:none}
.wrap{padding:20px}
h2{color:white;text-shadow:0 2px 5px rgba(0,0,0,0.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:rgba(255,255,255,0.95);padding:20px;border-radius:15px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,0.2);text-decoration:none;color:#333}
.card .icon{font-size:35px}
.card b{font-size:18px;color:#BF360C}
.card p{font-size:13px;color:#666;margin:5px 0 0 0}
.card:hover{transform:scale(1.03)}
.full{grid-column:span 2;background:#BF360C;color:white}
.full b{color:white}
.full p{color:#FFE0B2}
</style>
</head>
<body>
<div class="top"><b>🍞 Lywawa Bakery</b><a href="index.html">Logout</a></div>
<div class="wrap">
<h2>Welcome back, Manager! 👋</h2>
<div class="grid">
<a class="card" href="inventory.html"><div class="icon">📦</div><b>Inventory</b><p>Check stock</p></a>
<a class="card" href="products.html"><div class="icon">🍰</div><b>Products</b><p>Add / Delete products</p></a>
<a class="card" href="sales.html"><div class="icon">💰</div><b>New Sale</b><p>Sell to customer</p></a>
<a class="card" href="orders.html"><div class="icon">🧾</div><b>Orders</b><p>View all orders</p></a>
<a class="card full" href="reports.html"><div class="icon">📊</div><b>Reports</b><p>See today's total sales</p></a>
</div>
</div>
</body>
</html>
