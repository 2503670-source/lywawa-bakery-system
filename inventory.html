<!DOCTYPE html>
<html>
<head>
<title>Inventory - Lywawa Bakery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:0;background-image:url('bakery1.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.top{background:#BF360C;color:white;padding:15px 20px;display:flex;justify-content:space-between}
.top a{color:white;text-decoration:none}
.wrap{padding:15px}
input{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:13px;background:#BF360C;color:white;border:none;border-radius:8px;font-size:16px}
table{width:100%;background:white;border-collapse:collapse;border-radius:10px;overflow:hidden;margin-top:15px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#FFE0B2}
.low{color:red;font-weight:bold}
.del{color:red;cursor:pointer}
</style>
</head>
<body>
<div class="top"><b>📦 Inventory / Products</b><a href="dashboard.html">Back</a></div>
<div class="wrap">
<input id="name" placeholder="Product Name e.g. White Bread">
<input id="price" type="number" placeholder="Price Ksh">
<input id="stock" type="number" placeholder="Stock Qty">
<button onclick="addProduct()">Add Product</button>
<table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="list"></tbody></table>
</div>
<script>
// SAME KEY as Sales page - this is the fix!
var products = JSON.parse(localStorage.getItem('lywawa_products') || 'null') || [
{name:"White Bread",price:80,stock:45},
{name:"Chocolate Cake",price:850,stock:12},
{name:"Mandazi (3pcs)",price:50,stock:60},
{name:"Croissant",price:120,stock:20},
{name:"brown bread",price:80,stock:6},
{name:"Soft drinks",price:100,stock:10}
];
function save(){ localStorage.setItem('lywawa_products', JSON.stringify(products)); }
function show(){
  var h="";
  for(var i=0;i<products.length;i++){
    var p=products[i];
    var stock = p.stock<=5 ? "<span class='low'>"+p.stock+" LOW! ⚠️</span>" : p.stock;
    h+="<tr><td>"+p.name+"</td><td>Ksh "+p.price+"</td><td>"+stock+"</td><td><span style='color:green;cursor:pointer;font-weight:bold' onclick='restock("+i+")'>+ Restock</span> | <span class='del' onclick='del("+i+")'>Delete</span></td></tr>";
  }
  document.getElementById('list').innerHTML=h;
}
function addProduct(){
  var n=document.getElementById('name').value.trim();
  var pr=document.getElementById('price').value;
  var st=document.getElementById('stock').value;
  if(!n||!pr||st===""){ alert("Fill all fields"); return; }
  products.push({name:n,price:Number(pr),stock:Number(st)});
  save(); show();
  document.getElementById('name').value=""; document.getElementById('price').value=""; document.getElementById('stock').value="";
}
function restock(i){
  var add = prompt("How many "+products[i].name+" do you want to add? Current stock: "+products[i].stock);
  if(add==null || add=="") return;
  add = Number(add);
  if(isNaN(add) || add<=0){ alert("Enter a valid number"); return; }
  products[i].stock = Number(products[i].stock) + add;
  save(); show();
  alert("✅ Restocked! New stock for "+products[i].name+" is "+products[i].stock);
}
save(); show();
</script>
</body>
</html>
