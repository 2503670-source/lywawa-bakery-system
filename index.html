<!DOCTYPE html>
<html>
<head>
<title>Lywawa Bakery - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#FFF3E0;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:15px;width:320px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.logo{font-size:50px}
h2{color:#BF360C;margin:5px 0}
p{color:#666;font-size:14px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:13px;background:#BF360C;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.demo{background:#FFF3E0;padding:10px;border-radius:8px;margin-top:15px;font-size:13px}
</style>
</head>
<body>
<div class="box">
<div class="logo">🍞</div>
<h2>Lywawa Bakery</h2>
<p>Management System</p>
<input id="user" placeholder="Username" value="admin">
<input id="pass" type="password" placeholder="Password" value="admin123">
<button onclick="login()">Login</button>
<div class="demo">Demo Login<br><b>Username: admin<br>Password: admin123</b></div>
<p id="err" style="color:red"></p>
</div>
<script>
function login(){
  let u=document.getElementById('user').value.trim();
  let p=document.getElementById('pass').value.trim();
  if(u=="admin" && p=="admin123"){
    window.location.href="dashboard.html";
  } else {
    document.getElementById('err').innerText="Wrong! Use admin / admin123";
  }
}
</script>
</body>
</html>
