<!DOCTYPE html>
<html>
<head>
<title>Sales POS - Lywawa Bakery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:0;background-image:url('bakery1.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.top{background:#BF360C;color:white;padding:15px 20px;display:flex;justify-content:space-between}
.top a{color:white;text-decoration:none}
.wrap{padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:white;padding:15px;border-radius:10px;text-align:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.pcard b{font-size:14px}
.price{color:#BF360C;font-size:13px}
.stock{font-size:12px;color:#666}
.low{color:red;font-weight:bold}
.receipt{background:white;padding:15px;border-radius:10px;margin-top:15px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee;font-size:14px}
select{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:5px}
.green{background:#2E7D32;color:white}
.grey{background:#eee}
</style>
</head>
<body>
<div class="top"><b>🧾 Sales / POS</b><a href="dashboard.html">Back</a></div>
<div class="wrap">
<div class="grid" id="products"></div>
<div class="receipt">
<b>🧾 Receipt</b>
<div id="cart"><p>No items yet</p></div>
<div class="row"><b>Total:</b><b id="total">Ksh 0</b></div>
<select id="payment"><option>Cash</option><option>M-Pesa</option><option>Card</option></select>
<button class="btn green" onclick="completeSale()">Complete Sale</button>
<button class="btn grey" onclick="clearCart()">Clear</button>
<p id="msg" style="text-align:center;font-weight:bold"></p>
</div>
</div>
<script>
var products = JSON.parse(localStorage.getItem('lywawa_products') || 'null') || [
{name:"White Bread",price:80,cost:50,stock:45},
{name:"Chocolate Cake",price:850,cost:500,stock:12},
{name:"Mandazi (3pcs)",price:50,cost:20,stock:60},
{name:"Croissant",price:120,cost:70,stock:20},
{name:"brown bread",price:80,cost:50,stock:6},
{name:"Soft drinks",price:100,cost:60,stock:10}
];
var orders = JSON.parse(localStorage.getItem('lywawa_orders') || '[]');
var cart = {};

function saveProducts(){ localStorage.setItem('lywawa_products', JSON.stringify(products)); }

function showProducts(){
  var h="";
  for(var i=0;i<products.length;i++){
    var p=products[i];
    var stockText = p.stock<=5 ? "<div class='stock low'>Stock: "+p.stock+" - LOW! ⚠️</div>" : "<div class='stock'>Stock: "+p.stock+"</div>";
    h += "<div class='pcard' onclick='addToCart("+i+")'><b>"+p.name+"</b><div class='price'>Ksh "+p.price+"</div>"+stockText+"<div style='font-size:12px;color:#999'>+ Add</div></div>";
  }
  document.getElementById('products').innerHTML=h;
}

function addToCart(i){
  var p=products[i];
  if(p.stock<=0){ alert(p.name+" is OUT OF STOCK!"); return; }
  var current = cart[i] || 0;
  if(current >= p.stock){ alert("Only "+p.stock+" left for "+p.name); return; }
  cart[i]=current+1;
  showCart();
}

function showCart(){
  var h=""; var total=0; var has=false;
  for(var i in cart){
    has=true;
    var p=products[i]; var qty=cart[i]; var sub=p.price*qty; total+=sub;
    h+="<div class='row'><span>"+p.name+" x "+qty+"</span><span>Ksh "+sub+" <span onclick='removeOne("+i+")' style='color:red;cursor:pointer'> [x]</span></span></div>";
  }
  if(!has) h="<p>No items yet</p>";
  document.getElementById('cart').innerHTML=h;
  document.getElementById('total').innerText="Ksh "+total;
}

function removeOne(i){ delete cart[i]; showCart(); }
function clearCart(){ cart={}; showCart(); document.getElementById('msg').innerText=""; }

function completeSale(){
  var total=0; var has=false;
  for(var i in cart){ has=true; total+=products[i].price*cart[i]; }
  if(!has){ alert("Cart is empty! Click + Add first"); return; }
  var payment=document.getElementById('payment').value;

  // FIX: Minus stock for every item in cart
  for(var i in cart){
    var qty=cart[i];
    products[i].stock = Number(products[i].stock) - qty;
    orders.push({product:products[i].name, price:products[i].price, cost:products[i].cost||0, qty:qty, total:products[i].price*qty, payment:payment, date:new Date().toLocaleString()});
  }
  saveProducts();
  localStorage.setItem('lywawa_orders', JSON.stringify(orders));

  document.getElementById('msg').innerText="✅ Sale Complete! Ksh "+total+" - Stock Updated!";
  document.getElementById('msg').style.color="green";
  cart={}; showCart(); showProducts();
}

showProducts(); showCart();
</script>
</body>
</html>
