<!DOCTYPE html>
<html>
<head>
<title>New Sale - Lywawa Bakery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:0;background-image:url('bakery1.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.top{background:rgba(191,54,12,0.95);color:white;padding:15px 20px;display:flex;justify-content:space-between}
.top a{color:white;text-decoration:none}
.wrap{padding:20px}
select,input{padding:12px;width:100%;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:16px}
button{padding:13px;width:100%;background:#BF360C;color:white;border:none;border-radius:8px;font-size:16px}
.card{background:rgba(255,255,255,0.95);padding:15px;border-radius:15px;margin-bottom:10px}
.low{color:red;font-weight:bold}
.ok{color:green}
table{width:100%;background:white;border-collapse:collapse;border-radius:10px;overflow:hidden;margin-top:15px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#FFE0B2}
</style>
</head>
<body>
<div class="top"><b>💰 New Sale</b><a href="dashboard.html">Back</a></div>
<div class="wrap">
<div class="card">
<label>Select Product</label>
<select id="product" onchange="updateInfo()"></select>
<p id="info"></p>
<label>Quantity</label>
<input id="qty" type="number" value="1" min="1">
<label>Customer Name (optional)</label>
<input id="customer" placeholder="e.g. Mary">
<button onclick="makeSale()">Complete Sale ✅</button>
<p id="msg" style="text-align:center;font-weight:bold"></p>
</div>
<div class="card"><b>Today's Sales</b><table><thead><tr><th>Product</th><th>Qty</th><th>Total</th></tr></thead><tbody id="today"></tbody></table></div>
</div>
<script>
var products = JSON.parse(localStorage.getItem('lywawa_products') || '[]');
var orders = JSON.parse(localStorage.getItem('lywawa_orders') || '[]');

function loadProducts(){
  var sel=document.getElementById('product');
  sel.innerHTML="";
  for(var i=0;i<products.length;i++){
    var p=products[i];
    var opt=document.createElement('option');
    opt.value=i;
    opt.text=p.name + " - Ksh " + p.price + " (Stock: " + p.stock + ")";
    sel.appendChild(opt);
  }
  updateInfo(); showToday();
}
function updateInfo(){
  var i=document.getElementById('product').value;
  if(i==="" || !products[i]) return;
  var p=products[i];
  var el=document.getElementById('info');
  if(p.stock<=5){
    el.innerHTML="Price: Ksh "+p.price+" | Stock: <span class='low'>"+p.stock+" - LOW STOCK! ⚠️</span>";
  } else {
    el.innerHTML="Price: Ksh "+p.price+" | Stock: <span class='ok'>"+p.stock+"</span>";
  }
}
function makeSale(){
  var idx=document.getElementById('product').value;
  var qty=parseInt(document.getElementById('qty').value);
  var cust=document.getElementById('customer').value.trim() || "Walk-in";
  if(idx==="" || !products[idx]){ alert("No products! Add products first"); return; }
  if(!qty || qty<1){ alert("Enter quantity"); return; }
  var p=products[idx];
  if(p.stock < qty){
    alert("Not enough stock! Only "+p.stock+" left for "+p.name);
    return;
  }
  // THIS IS THE FIX: Minus stock
  p.stock = Number(p.stock) - qty;
  localStorage.setItem('lywawa_products', JSON.stringify(products));

  var total = Number(p.price)*qty;
  orders.push({product:p.name, price:p.price, qty:qty, total:total, customer:cust, date:new Date().toLocaleString()});
  localStorage.setItem('lywawa_orders', JSON.stringify(orders));

  document.getElementById('msg').innerText="✅ Sold "+qty+" x "+p.name+" = Ksh "+total+" | Remaining Stock: "+p.stock;
  document.getElementById('msg').style.color="green";
  loadProducts();
}
function showToday(){
  var h="";
  var total=0;
  for(var i=0;i<orders.length;i++){
    h+="<tr><td>"+orders[i].product+"</td><td>"+orders[i].qty+"</td><td>Ksh "+orders[i].total+"</td></tr>";
    total+=Number(orders[i].total);
  }
  if(!h) h="<tr><td colspan='3' style='text-align:center'>No sales yet today</td></tr>";
  else h+="<tr><td colspan='2'><b>Total</b></td><td><b>Ksh "+total+"</b></td></tr>";
  document.getElementById('today').innerHTML=h;
}
loadProducts();
</script>
</body>
</html>
